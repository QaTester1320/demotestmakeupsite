<!-- LUXURY SMOOTH BEFORE/AFTER COMPARISON SLIDER -->
<style>
    :root {
        --slider-bg: #0b0b0b;
        --slider-gold: #c5a059;
        --slider-font: 'Segoe UI', system-ui, sans-serif;
    }

    .luxury-slider-section {
        width: 100%;
        height: 100vh;
        background-color: var(--slider-bg);
        position: relative;
        overflow: hidden;
        font-family: var(--slider-font);
        user-select: none;
    }

    /* Container holding both image frames perfectly layered */
    .slider-images-container {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
    }

    /* Base Layer (Bottom): Natural, raw, unblended skin profile */
    .slider-pane-before {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .slider-pane-before img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        /* Natural, slightly flatter lighting texture */
        filter: brightness(0.85) contrast(0.95) saturate(0.9);
    }

    /* Overlay Layer (Top): Radiant, finished cosmetic makeup profile */
    .slider-pane-after {
        position: absolute;
        width: 50%; /* Adjusted dynamically via JavaScript */
        height: 100%;
        top: 0;
        left: 0;
        z-index: 2;
        overflow: hidden;
        border-right: 1px solid var(--slider-gold);
        box-shadow: 5px 0 30px rgba(0, 0, 0, 0.5);
    }

    .slider-pane-after img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        /* Rich matte depth, pristine vibrant makeup coloring and glow */
        filter: brightness(1.05) contrast(1.1) saturate(1.15);
    }

    /* Clean Editorial Labels fixed to each side */
    .slider-tag {
        position: absolute;
        bottom: 50px;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ffffff;
        z-index: 10;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        pointer-events: none;
    }

    .tag-before { left: 50px; }
    .tag-after { right: 50px; }

    /* Central Floating Title */
    .slider-headline-wrap {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
    }

    .slider-headline {
        color: #ffffff;
        font-size: 3rem;
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
        text-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* Luxury Interactive Drag Bar handle */
    .slider-handle-bar {
        position: absolute;
        top: 0;
        left: 50%; /* Synchronized dynamically with JS */
        width: 2px;
        height: 100%;
        background-color: var(--slider-gold);
        z-index: 5;
        cursor: ew-resize;
        transform: translateX(-50%);
    }

    /* Minimalist circle accent on the golden line to show it moves */
    .slider-handle-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        background-color: var(--slider-bg);
        border: 1px solid var(--slider-gold);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .slider-handle-button::before,
    .slider-handle-button::after {
        content: '';
        width: 0;
        height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        position: absolute;
    }
    .slider-handle-button::before {
        border-right: 6px solid var(--slider-gold);
        left: 10px;
    }
    .slider-handle-button::after {
        border-left: 6px solid var(--slider-gold);
        right: 10px;
    }
</style>

<section class="luxury-slider-section" id="sliderSection">
    
    <div class="slider-headline-wrap">
        <h2 class="slider-headline">The Clean Finish Matrix</h2>
    </div>

    <!-- Stationary Labels -->
    <span class="slider-tag tag-before">Phase I // Natural Base</span>
    <span class="slider-tag tag-after">Phase II // Finished Velvet</span>

    <div class="slider-images-container">
        <!-- BASE LEVEL: Natural Skin State -->
        <div class="slider-pane-before">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1600&auto=format&fit=crop" alt="Natural Unblended Portrait">
        </div>

        <!-- OVERLAY LEVEL: Glowing Finished Product State -->
        <div class="slider-pane-after" id="afterPane">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1600&auto=format&fit=crop" alt="Luxury Finished Blend Portrait">
        </div>
    </div>

    <!-- Interactive Track Line -->
    <div class="slider-handle-bar" id="sliderHandle">
        <div class="slider-handle-button"></div>
    </div>

</section>

<script>
    const sliderSection = document.getElementById('sliderSection');
    const afterPane = document.getElementById('afterPane');
    const sliderHandle = document.getElementById('sliderHandle');
    
    let isTracking = false;

    // Process fluid slider reposition mechanics safely
    function updateSliderPosition(clientX) {
        const bounds = sliderSection.getBoundingClientRect();
        const currentX = clientX - bounds.left;
        
        // Calculate percentages constrained between absolute boundaries
        let percentage = (currentX / bounds.width) * 100;
        if (percentage < 0) percentage = 0;
        if (percentage > 100) percentage = 100;

        // Shift layout styles perfectly in tandem
        afterPane.style.width = `${percentage}%`;
        sliderHandle.style.left = `${percentage}%`;
    }

    // Engagement Events
    sliderHandle.addEventListener('mousedown', () => isTracking = true);
    window.addEventListener('mouseup', () => isTracking = false);
    
    window.addEventListener('mousemove', (e) => {
        if (!isTracking) return;
        updateSliderPosition(e.clientX);
    });

    // Mobile Responsive Touch Support
    sliderHandle.addEventListener('touchstart', () => isTracking = true);
    window.addEventListener('touchend', () => isTracking = false);
    
    window.addEventListener('touchmove', (e) => {
        if (!isTracking) return;
        updateSliderPosition(e.touches[0].clientX);
    });
</script>
